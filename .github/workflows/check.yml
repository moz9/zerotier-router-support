name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Node tests
        run: node --test tests/*.mjs
      - name: Local configuration test
        run: sh tests/local-conf.sh openwrt/usr/libexec/zerotier-support/helper
      - name: ShellCheck
        run: |
          shellcheck --severity=warning -s sh openwrt/usr/libexec/zerotier-support/helper router-install.sh router-direct-install.sh
          shellcheck --severity=warning install.sh
